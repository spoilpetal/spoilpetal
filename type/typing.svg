<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="300"
    viewBox="0 0 1000 300"
>

<defs>

    <!-- ====================================================
         CRT SCANLINES
         ==================================================== -->

    <pattern
        id="scanlines"
        width="4"
        height="8"
        patternUnits="userSpaceOnUse"
    >

        <rect
            x="0"
            y="0"
            width="4"
            height="3"
            fill="#39ff14"
            opacity="0.045"
        />

    </pattern>


    <!-- ====================================================
         SOFT GREEN CRT GLOW
         ==================================================== -->

    <filter
        id="softGlow"
        x="-50%"
        y="-50%"
        width="200%"
        height="200%"
    >

        <feGaussianBlur
            stdDeviation="1.2"
            result="blur"
        />

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>

    </filter>


    <!-- ====================================================
         STRONGER CURSOR GLOW
         ==================================================== -->

    <filter
        id="cursorGlow"
        x="-100%"
        y="-100%"
        width="300%"
        height="300%"
    >

        <feGaussianBlur
            stdDeviation="2"
            result="blur"
        />

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>

    </filter>

</defs>


<!-- ========================================================
     CRT SCREEN
     ======================================================== -->

<rect
    x="0"
    y="0"
    width="1000"
    height="300"
    rx="18"
    fill="#020502"
/>


<!-- Outer CRT frame -->

<rect
    x="2"
    y="2"
    width="996"
    height="296"
    rx="18"
    fill="none"
    stroke="#39ff14"
    stroke-width="1"
    opacity="0.25"
/>


<!-- Inner CRT frame -->

<rect
    x="10"
    y="10"
    width="980"
    height="280"
    rx="13"
    fill="none"
    stroke="#0b4d16"
    stroke-width="1"
    opacity="0.35"
/>


<!-- ========================================================
     TYPING TEXT
     ========================================================

     Each character is an independent SVG path.

     Characters appear exactly according to the Python
     generated timeline.
     ========================================================


<!-- ========================================================
     SYNCHRONIZED CURSOR
     ======================================================== -->

<rect
    x="55.00"
    y="42.00"
    width="5"
    height="44"
    fill="#39ff14"
    filter="url(#cursorGlow)"
>

    <!-- ====================================================
         X POSITION

         DISCRETE is important.

         Without this, SVG interpolates between positions,
         which makes the cursor glide instead of stepping
         with the typed characters.
         ==================================================== -->

    <animate
        attributeName="x"

        values="55.00;81.40;107.80;134.20;160.60;187.00;213.40;239.80;266.20;292.60;319.00;345.40;371.80;55.00;81.40;107.80;134.20;160.60;187.00;213.40;55.00;81.40;107.80;134.20;160.60;187.00;213.40;239.80;266.20;292.60;319.00;345.40;371.80;398.20;424.60;451.00;477.40;503.80;530.20;556.60;583.00;609.40;635.80;662.20;688.60;715.00;741.40;767.80;794.20;820.60;847.00;873.40;899.80;899.80;899.80"

        keyTimes="0.000000;0.012222;0.024444;0.036667;0.048889;0.061111;0.073333;0.085556;0.097778;0.110000;0.122222;0.134444;0.146667;0.202222;0.214444;0.226667;0.238889;0.251111;0.263333;0.275556;0.331111;0.343333;0.355556;0.367778;0.380000;0.392222;0.404444;0.416667;0.428889;0.441111;0.453333;0.465556;0.477778;0.490000;0.502222;0.514444;0.526667;0.538889;0.551111;0.563333;0.575556;0.587778;0.600000;0.612222;0.624444;0.636667;0.648889;0.661111;0.673333;0.685556;0.697778;0.710000;0.722222;0.777778;1.000000"

        dur="9.0000s"

        repeatCount="indefinite"

        calcMode="discrete"
    />


    <!-- Y position -->

    <animate
        attributeName="y"

        values="42.00;42.00;42.00;42.00;42.00;42.00;42.00;42.00;42.00;42.00;42.00;42.00;42.00;107.00;107.00;107.00;107.00;107.00;107.00;107.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00;172.00"

        keyTimes="0.000000;0.012222;0.024444;0.036667;0.048889;0.061111;0.073333;0.085556;0.097778;0.110000;0.122222;0.134444;0.146667;0.202222;0.214444;0.226667;0.238889;0.251111;0.263333;0.275556;0.331111;0.343333;0.355556;0.367778;0.380000;0.392222;0.404444;0.416667;0.428889;0.441111;0.453333;0.465556;0.477778;0.490000;0.502222;0.514444;0.526667;0.538889;0.551111;0.563333;0.575556;0.587778;0.600000;0.612222;0.624444;0.636667;0.648889;0.661111;0.673333;0.685556;0.697778;0.710000;0.722222;0.777778;1.000000"

        dur="9.0000s"

        repeatCount="indefinite"

        calcMode="discrete"
    />


    <!-- Cursor blink -->

    <animate
        attributeName="opacity"

        values="1;0;1"

        dur="0.65s"

        repeatCount="indefinite"

    />

</rect>


<!-- ========================================================
     CRT SCANLINES
     ======================================================== -->

<rect
    x="0"
    y="0"
    width="1000"
    height="300"
    fill="url(#scanlines)"
    pointer-events="none"
/>


<!-- ========================================================
     CRT GLITCH BAR 1
     ======================================================== -->

<rect
    x="0"
    y="58"
    width="1000"
    height="2"
    fill="#39ff14"
    opacity="0"
    pointer-events="none"
>

    <animate
        attributeName="opacity"

        values="
            0;
            0;
            0.08;
            0;
            0;
            0.15;
            0;
            0;
            0.05;
            0
        "

        dur="2.3s"

        repeatCount="indefinite"
    />

</rect>


<!-- ========================================================
     CRT GLITCH BAR 2
     ======================================================== -->

<rect
    x="0"
    y="168"
    width="1000"
    height="3"
    fill="#39ff14"
    opacity="0"
    pointer-events="none"
>

    <animate
        attributeName="opacity"

        values="
            0;
            0.12;
            0;
            0;
            0.05;
            0;
            0.18;
            0;
            0
        "

        dur="3.1s"

        repeatCount="indefinite"
    />

</rect>


<!-- ========================================================
     CRT GLITCH BAR 3
     ======================================================== -->

<rect
    x="0"
    y="248"
    width="1000"
    height="1"
    fill="#39ff14"
    opacity="0"
    pointer-events="none"
>

    <animate
        attributeName="opacity"

        values="
            0;
            0;
            0.12;
            0;
            0.07;
            0;
            0
        "

        dur="1.7s"

        repeatCount="indefinite"
    />

</rect>


<!-- ========================================================
     CRT FLICKER
     ======================================================== -->

<rect
    x="0"
    y="0"
    width="1000"
    height="300"
    fill="#ffffff"
    opacity="0"
    pointer-events="none"
>

    <animate
        attributeName="opacity"

        values="
            0;
            0;
            0.015;
            0;
            0;
            0.025;
            0;
            0.008;
            0
        "

        dur="1.9s"

        repeatCount="indefinite"
    />

</rect>


<!-- ========================================================
     RED CRT GHOSTING
     ======================================================== -->

<rect
    x="0"
    y="0"
    width="1000"
    height="300"
    fill="none"
    stroke="#ff0033"
    stroke-width="1"
    opacity="0.025"
    pointer-events="none"
>

    <animate
        attributeName="x"

        values="0;2;-1;0"

        dur="1.3s"

        repeatCount="indefinite"
    />

</rect>


<!-- ========================================================
     BLUE CRT GHOSTING
     ======================================================== -->

<rect
    x="0"
    y="0"
    width="1000"
    height="300"
    fill="none"
    stroke="#0066ff"
    stroke-width="1"
    opacity="0.025"
    pointer-events="none"
>

    <animate
        attributeName="x"

        values="0;-2;1;0"

        dur="1.7s"

        repeatCount="indefinite"
    />

</rect>


</svg>
