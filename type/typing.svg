        repeatCount="indefinite"

    />


    <!-- Blinking -->

    <animate

        attributeName="opacity"

        values="1;0;1"

        dur="0.72s"

        repeatCount="indefinite"

    />

</rect>


<!-- ========================================================
     CRT SCANLINES
     ======================================================== -->

<rect

    width="1000"
    height="300"

    fill="url(#scanlines)"

    pointer-events="none"

/>


<!-- ========================================================
     CRT FLICKER
     ======================================================== -->

<rect

    width="1000"
    height="300"

    fill="#ffffff"

    opacity="0"

    pointer-events="none"

>

    <animate

        attributeName="opacity"

        values="
            0;
            0;
            0.018;
            0;
            0;
            0.008;
            0;
            0.014;
            0
        "

        dur="2.9s"

        repeatCount="indefinite"

    />

</rect>


<!-- ========================================================
     HORIZONTAL CRT DISTORTION LINES
     ======================================================== -->

<g
    stroke="#39ff14"
    opacity="0.035"
>

    <line
        x1="0"
        x2="1000"
        y1="38"
        y2="38"
    />

    <line
        x1="0"
        x2="1000"
        y1="142"
        y2="142"
    />

    <line
        x1="0"
        x2="1000"
        y1="255"
        y2="255"
    />

</g>


<!-- ========================================================
     SCREEN FLICKER
     ======================================================== -->

<animate
    attributeName="opacity"

    values="
        1;
        0.98;
        1;
        0.995;
        1
    "

    dur="0.13s"

    repeatCount="indefinite"

/>


</svg>
