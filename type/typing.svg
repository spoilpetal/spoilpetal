<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="300"
    viewBox="0 0 1000 300"
>

<defs>

    <!-- CRT glow -->

    <filter
        id="crtGlow"
        x="-20%"
        y="-20%"
        width="140%"
        height="140%"
    >

        <feGaussianBlur
            stdDeviation="1.5"
            result="blur"
        />

        <feMerge>

            <feMergeNode in="blur"/>

            <feMergeNode in="SourceGraphic"/>

        </feMerge>

    </filter>


    <!-- Scanlines -->

    <pattern
        id="scanlines"
        width="4"
        height="8"
        patternUnits="userSpaceOnUse"
    >

        <rect
            width="4"
            height="3"
            fill="#39ff14"
            opacity="0.035"
        />

    </pattern>


    <!-- Slight screen glow -->

    <radialGradient id="screenGlow">

        <stop
            offset="0%"
            stop-color="#0aff35"
            stop-opacity="0.055"
        />

        <stop
            offset="100%"
            stop-color="#000000"
            stop-opacity="0"
        />

    </radialGradient>

</defs>


<!-- ========================================================
     CRT BODY
     ======================================================== -->

<rect
    width="1000"
    height="300"
    rx="18"
    fill="#020502"
/>


<!-- Screen glow -->

<rect
    width="1000"
    height="300"
    rx="18"
    fill="url(#screenGlow)"
/>


<!-- CRT frame -->

<rect
    x="3"
    y="3"
    width="994"
    height="294"
    rx="18"
    fill="none"
    stroke="#39ff14"
    stroke-width="1"
    opacity="0.25"
/>


<!-- ========================================================
     TEXT
     ======================================================== -->


<!-- ========================================================
     TERMINAL CURSOR
     ======================================================== -->

