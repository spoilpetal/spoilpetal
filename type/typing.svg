<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="300"
    viewBox="0 0 900 300"
>

<defs>

    <!-- ====================================================
         FONT
         ==================================================== -->

    <style>

        @font-face {
            font-family: "1942 Report";

            src:
                url(
                    "data:font/woff2;base64,"
                )
                format("woff2");
        }

        .terminal {
            font-family: "1942 Report", monospace;
            font-size: 44px;
            fill: #00ff66;
        }

    </style>


    <!-- ====================================================
         CRT GLOW
         ==================================================== -->

    <filter id="glow">

        <feGaussianBlur
            stdDeviation="1.4"
            result="blur"
        />

        <feMerge>

            <feMergeNode in="blur"/>

            <feMergeNode in="SourceGraphic"/>

        </feMerge>

    </filter>


    <!-- ====================================================
         SCREEN SCANLINES
         ==================================================== -->

    <pattern
        id="scanlines"
        width="4"
        height="6"
        patternUnits="userSpaceOnUse"
    >

        <rect
            width="4"
            height="3"
            fill="#00ff66"
            opacity="0.025"
        />

    </pattern>

</defs>


<!-- ========================================================
     CRT SCREEN
     ======================================================== -->

<rect
    width="900"
    height="300"
    rx="14"
    fill="#030603"
/>


<!-- CRT glow -->

<rect
    x="4"
    y="4"
    width="892"
    height="292"
    rx="12"
    fill="none"
    stroke="#00ff66"
    stroke-width="1"
    opacity="0.22"
/>


<!-- Scanlines -->

<rect
    width="900"
    height="300"
    fill="url(#scanlines)"
/>


<!-- ========================================================
     TYPING TEXT
     ========================================================

     Each character:

     invisible
          ↓
     appears
          ↓
     remains
          ↓
     disappears at loop
          ↓
     starts again
     ========================================================


<text
    x="50.000"
    y="80"
    class="terminal"
    filter="url(#glow)"
    opacity="0"
>
    H

