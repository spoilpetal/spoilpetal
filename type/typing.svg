<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="300"
    viewBox="0 0 1000 300"
>

<defs>

    <!-- CRT glow -->

    <filter
        id="glow"
        x="-50%"
        y="-50%"
        width="200%"
        height="200%"
    >

        <feGaussianBlur
            stdDeviation="1.3"
            result="blur"
        />

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>

    </filter>


    <!-- Scanlines -->

    <pattern
        id="scanlines"
        width="4"
        height="8"
        patternUnits="userSpaceOnUse"
    >

        <rect
            width="4"
            height="3"
            fill="#39ff14"
            opacity="0.035"
        />

    </pattern>

</defs>


<!-- ========================================================
     SCREEN
     ======================================================== -->

<rect
    x="0"
    y="0"
    width="1000"
    height="300"
    rx="16"
    fill="#020502"
/>


<!-- CRT border -->

<rect
    x="2"
    y="2"
    width="996"
    height="296"
    rx="16"
    fill="none"
    stroke="#39ff14"
    stroke-width="1"
    opacity="0.25"
/>


<!-- ========================================================
     TEXT
     ======================================================== -->


