        dur="8.8500s"

        repeatCount="indefinite"
    />

    <animate
        attributeName="opacity"

        values="1;0;1"

        dur="0.7s"

        repeatCount="indefinite"
    />

</rect>


<!-- ========================================================
     CRT SCANLINES
     ======================================================== -->

<rect
    width="1000"
    height="300"
    fill="url(#scanlines)"
    pointer-events="none"
/>


<!-- ========================================================
     CRT FLICKER
     ======================================================== -->

<rect
    width="1000"
    height="300"
    fill="#ffffff"
    opacity="0"
    pointer-events="none"
>

    <animate
        attributeName="opacity"

        values="
            0;
            0;
            0.015;
            0;
            0;
            0.008;
            0;
            0.012;
            0
        "

        dur="2.8s"

        repeatCount="indefinite"
    />

</rect>


<!-- ========================================================
     RANDOM-LOOKING CRT HORIZONTAL LINES
     ======================================================== -->

<g
    stroke="#39ff14"
    opacity="0.035"
>

    <line
        x1="0"
        x2="1000"
        y1="42"
        y2="42"
    />

    <line
        x1="0"
        x2="1000"
        y1="145"
        y2="145"
    />

    <line
        x1="0"
        x2="1000"
        y1="255"
        y2="255"
    />

</g>


</svg>
